spring.application.name=train-booking-backend


server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/train_ticketing_db?createDatabaseIfNotExist=true

spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=change-this-secret-key-change-this-secret-key-change-this-secret-key
app.jwt.expiration-ms=86400000

app.admin.email=admin@trainapp.com
app.admin.password=admin123

app.email.mode=real
app.email.from=YOUR_EMAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_EMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

spring.mail.properties.mail.debug=true